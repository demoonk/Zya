[package]
name = "zya"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "z_single_app"
path = "src/main.rs"

[[bin]]
name = "z_single_launcher"
path = "../tools/zya_launcher.rs"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Console", "Win32_System_Threading", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_Xps"] }
